# SonarQube configuration — NutriVillage AI (Modul 5-7, Next.js App Router)
# Jalankan: sonar-scanner -Dproject.settings=sonar-project.properties
# (butuh SonarQube server lokal / SonarCloud dan SONAR_TOKEN).

sonar.projectKey=nutrivillage-ai-next
sonar.projectName=NutriVillage AI - Next.js (Modul 5-7)
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Hasil coverage (jika pengujian dijalankan dengan coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Pengecualian: berkas build, dependensi, deklarasi tipe, dan aset.
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  src/app/**/loading.tsx,\
  src/app/**/not-found.tsx

# Aturan kualitas (Quality Gate) yang menjadi fokus verifikasi statis.
sonar.qualitygate.wait=false
