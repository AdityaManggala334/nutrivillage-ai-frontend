# SonarQube configuration — NutriVillage AI (Front-End, Modul 1-8)
# Jalankan: npx sonar-scanner -Dproject.settings=sonar-project.properties
# (memerlukan SonarQube server / SonarCloud dan SONAR_TOKEN).

sonar.projectKey=nutrivillage-ai-frontend
sonar.projectName=NutriVillage AI - Front-End (Vite + Strict TypeScript + Biome)
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Kecualikan build output, dependensi, deklarasi tipe, dan proyek Next.js (Modul 5-7).
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.d.ts,\
  web-next/**

# Abaikan deteksi duplikasi (CPD) untuk berkas deklaratif yang sengaja mirip
# antara proyek Vite (Modul 1-4/8) dan proyek Next.js (Modul 5-7).
sonar.cpd.exclusions=\
  **/schemas/**,\
  **/types/**,\
  **/*.d.ts

sonar.qualitygate.wait=false
